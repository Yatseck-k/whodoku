services:
  php:
    build: ./docker/php
    working_dir: /workspace
    user: '${WHODOKU_UID:-1000}:${WHODOKU_GID:-1000}'
    volumes:
      - .:/workspace
    environment:
      HOME: /tmp
      COMPOSER_VENDOR_DIR: /workspace/vendor
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_KEY: base64:V0hvZG9rdURldmVsb3BtZW50S2V5MTIzNDU2Nzg5MDE=
      APP_URL: http://localhost:8088
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: whodoku
      DB_USERNAME: whodoku
      DB_PASSWORD: whodoku
      SESSION_DRIVER: file
      CACHE_STORE: file
      TELEGRAM_DEV_LOGIN: 'true'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8088:8088'
    command: php -S 0.0.0.0:8088 -t dev-app/public dev-app/public/index.php
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: whodoku
      POSTGRES_USER: whodoku
      POSTGRES_PASSWORD: whodoku
    volumes:
      - whodoku-db:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-whodoku.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U whodoku -d whodoku']
      interval: 2s
      timeout: 5s
      retries: 30
  node:
    image: node:24-alpine
    working_dir: /workspace
    user: '${WHODOKU_UID:-1000}:${WHODOKU_GID:-1000}'
    volumes:
      - .:/workspace
    profiles: ['tools']
    entrypoint: npm
volumes:
  whodoku-db:
